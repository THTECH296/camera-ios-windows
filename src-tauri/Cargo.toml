[package]
name = "camera"
version = "1.0.0"
description = "Câmera: o app Câmera do iOS no Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
